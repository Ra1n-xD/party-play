name: Deploy to VPS

on:
  push:
    branches: [main]

concurrency:
  group: partyplay-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          command_timeout: 30m
          script: |
            set -eu
            cd ~/party-play
            git fetch --quiet origin main
            deploy_script=$(mktemp)
            trap 'rm -f "$deploy_script"' EXIT
            git show "${{ github.sha }}:deploy.sh" > "$deploy_script"
            PARTYPLAY_TARGET_COMMIT="${{ github.sha }}" bash "$deploy_script"
