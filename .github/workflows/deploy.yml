name: Deploy to VPS

on:
  push:
    branches: [main]

concurrency:
  group: partyside-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 95

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          PARTYSIDE_PROJECT_DIR: ${{ vars.VPS_PROJECT_DIR }}
          PARTYSIDE_DEPLOY_WAIT_SECONDS: ${{ vars.VPS_DEPLOY_WAIT_SECONDS }}
          PARTYSIDE_ALLOW_LEGACY_DEPLOY: ${{ vars.VPS_ALLOW_LEGACY_DEPLOY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          command_timeout: 90m
          envs: PARTYSIDE_PROJECT_DIR,PARTYSIDE_DEPLOY_WAIT_SECONDS,PARTYSIDE_ALLOW_LEGACY_DEPLOY
          script: |
            set -eu
            if [ -z "${PARTYSIDE_PROJECT_DIR:-}" ]; then
              if [ -d "$HOME/party-side/.git" ]; then
                PARTYSIDE_PROJECT_DIR="$HOME/party-side"
              else
                PARTYSIDE_PROJECT_DIR="$HOME/party-play"
              fi
            fi
            export PARTYSIDE_PROJECT_DIR
            cd "$PARTYSIDE_PROJECT_DIR"
            git fetch --quiet origin main
            deploy_script=$(mktemp)
            trap 'rm -f "$deploy_script"' EXIT
            git show "${{ github.sha }}:deploy.sh" > "$deploy_script"
            PARTYSIDE_TARGET_COMMIT="${{ github.sha }}" bash "$deploy_script"
