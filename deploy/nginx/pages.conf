# Include inside the existing application server block, after removing its
# location / fallback and any duplicate exact locations or error_page rules.
# Keep the existing root, TLS, API, Socket.IO and ACME configuration.
# This fragment does not redirect to a different domain.

error_page 404 /404.html;

location = /404.html {
    internal;
}

location = /404 {
    return 404;
}

location = /games {
    return 404;
}

location = /games/ {
    return 404;
}

location = /assets {
    return 404;
}

location = / {
    try_files /index.html =404;
}

location / {
    # Each public or account route has its own prerendered HTML.
    # Static files stay available; unknown URLs retain HTTP 404.
    try_files $uri.html $uri =404;
}
